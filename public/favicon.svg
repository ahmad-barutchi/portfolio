<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0b0d14; }
    .beacon { fill: #ffb454; }
    .ring { fill: none; stroke: #ffb454; stroke-opacity: 0.6; stroke-width: 1.5; stroke-linecap: round; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f7f4ee; }
      .beacon { fill: #e0781a; }
      .ring { stroke: #e0781a; stroke-opacity: 0.75; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <path class="ring" d="M16 6a10 10 0 1 1-10 10"/>
  <circle class="beacon" cx="16" cy="16" r="5"/>
</svg>
